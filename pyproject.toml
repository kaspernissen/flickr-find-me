[project]
name = "flickr-find-me"
version = "0.1.0"
description = "Find yourself in a Flickr album and download the originals"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kasper Borg Nissen", email = "kaspernissen@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gallery-dl>=1.32.21",
    "httpx>=0.28.1",
    "insightface>=2.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=5.1.0.95",
]

[project.scripts]
flickr-find-me = "flickr_find_me.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not network and not model'"
markers = ["network: hits Flickr", "model: loads InsightFace models"]

[tool.uv]
# insightface depends on opencv-python (needs X11/GL libs); the headless build provides the same cv2.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
